name: ARR engine-free CI

# M2.6 (fix #6): a real remote gate for the unified Research Runtime. This workflow
# runs the ENGINE-FREE suite only -- it never needs the SciNet++ torch checkout
# (SCINET_DIR) or real exchange data, so it executes on plain ubuntu runners.
# Engine-dependent runs (real SciNet++ / robotics / exchange backtest) remain
# operator-driven with fail-closed local verification (see M2_6_*_loop.log).
on:
  push:
    branches: [feature/arr-0.1-domain-registry]
  pull_request:
    branches: [feature/arr-0.1-domain-registry]

jobs:
  engine-free-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install minimal deps
        run: python -m pip install --upgrade pip pyyaml
      - name: Run engine-free research_runtime tests
        run: python -m unittest research_runtime.tests.test_loop research_runtime.tests.test_unified_candidate -v
