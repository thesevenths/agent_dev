name: ARR Research Runtime (M2.7 + M3.0)

# ---------------------------------------------------------------------------
# M2.7 P0-3: the M2.6 engine-free gate was created at the WRONG path
#   multi-agent/.github/workflows/arr_ci.yml
# GitHub Actions only auto-discovers workflows under <REPO-ROOT>/.github/workflows/,
# so that file was never run. It is moved here and renamed arr-research-runtime.yml.
#
# The EXISTING root workflow .github/workflows/arr-0.1.yml (ARR 0.1 integration)
# is PRESERVED untouched -- this is an ADDITIONAL gate, not a replacement.
#
# Runs the UNIFIED Research Runtime suite on every push/PR to the ARR feature
# branch. ENGINE-FREE: no torch / SciNet++ checkout / real robot / exchange data.
# Real-engine runs remain operator-driven with fail-closed local verification.
#
# Dependency note (verified in a CLEAN venv):
#   `pyyaml` ALONE is NOT enough. research_runtime/__init__.py imports
#   research_runtime/schemas.py -> `from pydantic import ...` at MODULE level.
#   M3.0's statistics.py is PURE STANDARD LIBRARY (beta function via Lentz
#   continued fraction + bisection) -- deliberately NO numpy/scipy/pandas, so
#   the minimal verified set stays: PyYAML>=6.0 + pydantic>=2.7.4.
#   Verified: 89 passed, 0 failed in a clean venv with exactly these two.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [feature/arr-0.1-domain-registry]
  pull_request:
    branches: [feature/arr-0.1-domain-registry]
  workflow_dispatch:

jobs:
  research-runtime-tests:
    # Repo-root placement + working-directory: the ARR suites live under
    # multi-agent/, while GitHub discovers workflows ONLY at the repo root.
    defaults:
      run:
        working-directory: multi-agent
        shell: bash
    name: ARR 1.1 runtime (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal verified deps
        run: |
          python -m pip install --upgrade pip
          # pytest >= 8 is required by the M3.2 / M3.4 pytest-based gates added
          # in P0-4. PyYAML + pydantic remain the minimal verified runtime set.
          python -m pip install "PyYAML>=6.0" "pydantic>=2.7.4" "pytest>=8.0"

      - name: Run unified Research Runtime engine-free suite
        # Covered modules:
        #   test_loop              -> loop controller / recovery / version inheritance
        #   test_unified_candidate -> candidate lifecycle, domain_evolver,
        #                            materialize/evaluate_domain_candidate,
        #                            evolution_controller dual-layer separation
        #   test_m2_7_reliability  -> statistical gate (_decide_domain),
        #                            holdout isolation, CLI arg defaults,
        #                            frozen-manifest fail-closed + resume re-verify
        #   test_m3_0_statistics   -> Student-t CI (df=4 -> 2.776, NOT 1.96),
        #                            Holm step-down, bidirectional significance,
        #                            missing-statistic fail-closed, holdout
        #                            per-seed direction confirmation, M2.7
        #                            historical ACCEPT re-evaluation
        run: |
          python -m unittest \
            research_runtime.tests.test_loop \
            research_runtime.tests.test_unified_candidate \
            research_runtime.tests.test_m2_7_reliability \
            research_runtime.tests.test_m3_0_statistics \
            -v

      - name: Run M3.0 / M3.2 / M3.3 / M3.4 / M4.0 pytest gates
        # Root-level ACTIVE workflow. M3.x statistical regressions plus the
        # M4.0 knowledge-foundation suites (objectives / entity_links /
        # backfill / unified evidence read model). All ENGINE-FREE and
        # self-contained: research.sqlite and the 38 MB evidence.jsonl are
        # git-ignored, so tests rebuild an equivalent DB from the committed
        # READ-ONLY p1_06_db_seed.json rather than depending on a dev machine.
        env:
          # Avoid an optional langsmith pytest plugin that needs network and
          # crashes collection; none of these tests need any external plugin.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set +e
          python -m pytest \
            research_runtime/tests/test_m3_0_statistics.py \
            research_runtime/tests/test_m3_2_embodied_real_data.py \
            research_runtime/tests/test_m3_3_scinet_ood.py \
            research_runtime/tests/test_m3_4_scheduler.py \
            research_runtime/tests/test_m3_4_embodied_horizon.py \
            research_runtime/tests/test_m4_0_objective_store.py \
            research_runtime/tests/test_m4_0_entity_link_store.py \
            research_runtime/tests/test_m4_0_backfill.py \
            research_runtime/tests/test_m4_0_evidence_read_model.py \
            -q > m3_pytest.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            # Job logs need repo admin to download; re-publish the failure
            # lines as annotations so a red matrix is diagnosable publicly.
            grep -E "^(FAILED |ERROR |E   |[0-9]+ (failed|error))|AssertionError|Error:|ModuleNotFoundError|ImportError" m3_pytest.log \
              | tail -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            tail -80 m3_pytest.log
          else
            tail -5 m3_pytest.log
          fi
          exit "$rc"

      - name: Verify CLI safety defaults + frozen statistical protocol
        # Independent smoke: the production entry point must default to
        # require-frozen-manifest ON, 5 paired seeds, holdout confirmation ON,
        # and the gate must use the Student-t critical value (not the old 1.96).
        run: |
          python -c "
          from research_runtime.cli import build_parser
          from research_runtime.evolution.statistics import student_t_crit_two_sided
          a = build_parser().parse_args(['loop','--domain','scinet','--baseline-config','b.yaml','--project-dir','p'])
          assert a.require_frozen_manifest is True, 'frozen-manifest must default ON'
          assert a.require_holdout_confirmation is True, 'holdout confirmation must default ON'
          assert a.seeds == [50,51,52,53,54], 'formal ACCEPT requires >=5 seeds by default'
          assert a.min_seeds_for_accept >= 5
          t4 = student_t_crit_two_sided(0.05, 4)
          assert abs(t4 - 2.7764451052) < 1e-6, 'M3.0 Student-t gate must be active'
          assert t4 > 2.77, 'normal 1.96 must NOT be used at n=5'
          b = build_parser().parse_args(['loop','--domain','scinet','--baseline-config','b.yaml','--project-dir','p','--allow-unfrozen-data'])
          assert b.require_frozen_manifest is False, 'explicit dev opt-out must work'
          print('CLI safety defaults + M3.0 protocol OK (t_df4=%.6f)' % t4)
          "
