name: ARR Research Runtime (M2.7 + M3.0)

# ---------------------------------------------------------------------------
# M2.7 P0-3: the M2.6 engine-free gate was created at the WRONG path
#   multi-agent/.github/workflows/arr_ci.yml
# GitHub Actions only auto-discovers workflows under <REPO-ROOT>/.github/workflows/,
# so that file was never run. It is moved here and renamed arr-research-runtime.yml.
#
# The EXISTING root workflow .github/workflows/arr-0.1.yml (ARR 0.1 integration)
# is PRESERVED untouched -- this is an ADDITIONAL gate, not a replacement.
#
# Runs the UNIFIED Research Runtime suite on every push/PR to the ARR feature
# branch. ENGINE-FREE: no torch / SciNet++ checkout / real robot / exchange data.
# Real-engine runs remain operator-driven with fail-closed local verification.
#
# Dependency note (verified in a CLEAN venv):
#   `pyyaml` ALONE is NOT enough. research_runtime/__init__.py imports
#   research_runtime/schemas.py -> `from pydantic import ...` at MODULE level.
#   M3.0's statistics.py is PURE STANDARD LIBRARY (beta function via Lentz
#   continued fraction + bisection) -- deliberately NO numpy/scipy/pandas, so
#   the minimal verified set stays: PyYAML>=6.0 + pydantic>=2.7.4.
#   Verified: 89 passed, 0 failed in a clean venv with exactly these two.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [feature/arr-0.1-domain-registry, feature/arr-m6-harness-rsi]
  pull_request:
    branches: [feature/arr-0.1-domain-registry, feature/arr-m6-harness-rsi]
  workflow_dispatch:

jobs:
  research-runtime-tests:
    # Repo-root placement + working-directory: the ARR suites live under
    # multi-agent/, while GitHub discovers workflows ONLY at the repo root.
    defaults:
      run:
        working-directory: multi-agent
        shell: bash
    name: ARR 1.1 runtime (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal verified deps
        run: |
          python -m pip install --upgrade pip
          # pytest >= 8 is required by the M3.2 / M3.4 pytest-based gates added
          # in P0-4. PyYAML + pydantic remain the minimal verified runtime set.
          python -m pip install "PyYAML>=6.0" "pydantic>=2.7.4" "pytest>=8.0"

      - name: Run unified Research Runtime engine-free suite
        # Covered modules:
        #   test_loop              -> loop controller / recovery / version inheritance
        #   test_unified_candidate -> candidate lifecycle, domain_evolver,
        #                            materialize/evaluate_domain_candidate,
        #                            evolution_controller dual-layer separation
        #   test_m2_7_reliability  -> statistical gate (_decide_domain),
        #                            holdout isolation, CLI arg defaults,
        #                            frozen-manifest fail-closed + resume re-verify
        #   test_m3_0_statistics   -> Student-t CI (df=4 -> 2.776, NOT 1.96),
        #                            Holm step-down, bidirectional significance,
        #                            missing-statistic fail-closed, holdout
        #                            per-seed direction confirmation, M2.7
        #                            historical ACCEPT re-evaluation
        #   M4.0 + M4.0.1          -> objectives / entity_links / backfill /
        #                            unified evidence read model / integrity
        #                            SHA-stat split / Discovery adapter contract.
        #                            All ENGINE-FREE and self-contained: the
        #                            research.sqlite + 38 MB evidence.jsonl are
        #                            git-ignored, so tests rebuild an equivalent
        #                            DB from the committed READ-ONLY p1_06 seed.
        run: |
          python -m unittest \
            research_runtime.tests.test_loop \
            research_runtime.tests.test_unified_candidate \
            research_runtime.tests.test_m2_7_reliability \
            research_runtime.tests.test_m3_0_statistics \
            -v

      - name: Run M3.0 / M3.2 / M3.3 / M3.4 / M4.0 / M4.1 / M4-E2E-01 pytest gates
        # Root-level ACTIVE workflow. M3.x statistical regressions plus the
        # M4.0 knowledge-foundation suites (objectives / entity_links /
        # backfill / unified evidence read model / Discovery adapter contract)
        # and the M4.1-00 Discovery Context Provider suite. All ENGINE-FREE and
        # self-contained: research.sqlite and the 38 MB evidence.jsonl are
        # git-ignored, so tests rebuild an equivalent DB from the committed
        # READ-ONLY p1_06_db_seed.json rather than depending on a dev machine.
        #
        # M4-E2E-01 (ARR closure hardening) gates:
        #   * test_m4_e2e_01_discovery.py        -> objective/evidence/Critic wiring
        #   * test_m4_e2e_01_director.py         -> Director state machine / recovery
        #   * test_m4_e2e_01_p1_wiring.py        -> Objective->Hypothesis/Plan real wiring
        #   * test_m4_e2e_01_p1_idempotency.py  -> campaign idempotency / crash recovery
        #   * test_m4_e2e_01_p6_engine_free.py   -> OUT-OF-BAND approval_cli subprocess
        #                                            grant + round-2 Discovery reads
        #                                            round-1 Experience (engine-free,
        #                                            CI-runnable proof of the two P6
        #                                            behaviours)
        #   * test_m4_e2e_01_real_engine.py      -> REAL SciNet++ chain (OPT-IN,
        #                                            skipped unless M4_E2E_01_RUN_REAL=1
        #                                            AND a SciNet++ checkout exists)
        #
        # M4.3-00 Closure (P0-01..P0-06) + M4.3-01 A/B/C Harness gates:
        #   * test_m4_3_p0_01_failure_refs.py        -> typed failure evidence refs
        #   * test_m4_3_p0_02_ood_evidence.py       -> real comparable ID/OOD metrics
        #   * test_m4_3_p0_03_campaign_recovery.py  -> round cap / state-classified recovery
        #   * test_m4_3_p0_04_director_recovery.py -> Report+Experience 3-proof COMPLETED
        #   * test_m4_3_p0_06_approval_boundary.py -> accurate approval trust model
        #   * test_m4_3_evaluation_harness.py       -> A/B/C controls, blind review,
        #                                             frozen metrics, full retention
        #
        # M4.3-02 Integrated Experiment Runtime gates:
        #   * test_m4_3_02_p0_gate_success.py -> terminal != successful, precise
        #                                        association, no campaign reuse
        #   * test_m4_3_02_state_machine.py   -> 23-state controller, budget,
        #                                        restart reconciliation
        #   * test_m4_3_02_review_queue.py    -> human blind-review submissions
        #   * test_m4_3_02_analysis_report.py -> pilot analysis / sample size /
        #                                        value report
        #   * test_m4_3_02_confirmatory.py    -> protocol freeze + human gate
        #   * test_m4_3_02_cli.py             -> unified CLI wiring
        #   * test_m4_3_02_1_*                -> M4.3-02.1 Pilot Closure gates:
        #                                        paired eligibility, outcome
        #                                        semantics, dual-metric sample
        #                                        size, fixed test family,
        #                                        approval/group accuracy,
        #                                        human review closure
        #   * test_m4_3_02_real_engine.py     -> REAL pilot E2E (OPT-IN; SKIPS
        #                                        without M4_3_RUN_REAL=1)
        #
        # M4.3-01.1 A/B/C Harness OPERATIONAL HARDENING gates (all ENGINE-FREE
        # except the two explicitly gated real-engine tests):
        #   * test_m4_3_01_1_p0_01_gate.py       -> real ResearchService gate adapter;
        #                                          no forged verdict / optimistic default
        #   * test_m4_3_01_1_p0_02_blinding.py  -> opaque review_id, sealed arm mapping,
        #                                          >=2 append-only blind reviewers
        #   * test_m4_3_01_1_p0_03_persistence.py-> durable append-only registry, restart
        #                                          recovery, SHA integrity
        #   * test_m4_3_01_1_p0_04_protocol.py  -> 20-field confirmatory freeze
        #   * test_m4_3_01_1_p1_01_metrics.py   -> all 16 metrics per arm, block pairing
        #   * test_m4_3_01_1_p1_02_boundary.py  -> explicit disjoint ID sets, frozen
        #                                          final split ban, fixed budgets
        #   * test_m4_3_01_1_p1_03_real_engine.py -> REAL SciNet++ A/B/C E2E (OPT-IN;
        #                                          SKIPS without checkout + evidence +
        #                                          M4_3_01_1_RUN_REAL=1; no FakeRunner)
        #   (P0-05 / P1-03 are the gated real-engine E2Es; engine-free and
        #    real-engine results are reported separately.)
        env:
          # Avoid an optional langsmith pytest plugin that needs network and
          # crashes collection; none of these tests need any external plugin.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set +e
          python -m pytest \
            research_runtime/tests/test_m3_0_statistics.py \
            research_runtime/tests/test_m3_2_embodied_real_data.py \
            research_runtime/tests/test_m3_3_scinet_ood.py \
            research_runtime/tests/test_m3_4_scheduler.py \
            research_runtime/tests/test_m3_4_embodied_horizon.py \
            research_runtime/tests/test_m4_0_objective_store.py \
            research_runtime/tests/test_m4_0_entity_link_store.py \
            research_runtime/tests/test_m4_0_backfill.py \
            research_runtime/tests/test_m4_0_evidence_read_model.py \
            research_runtime/tests/test_m4_0_validate_integrity.py \
            research_runtime/tests/test_m4_0_discovery_adapter.py \
            research_runtime/tests/test_m4_0_discovery_context_provider.py \
            research_runtime/tests/test_m4_e2e_01_discovery.py \
            research_runtime/tests/test_m4_e2e_01_director.py \
            research_runtime/tests/test_m4_e2e_01_p1_wiring.py \
            research_runtime/tests/test_m4_e2e_01_p1_idempotency.py \
            research_runtime/tests/test_m4_e2e_01_p6_engine_free.py \
            research_runtime/tests/test_m4_e2e_01_real_engine.py \
            research_runtime/tests/test_m4_3_p0_01_failure_refs.py \
            research_runtime/tests/test_m4_3_p0_02_ood_evidence.py \
            research_runtime/tests/test_m4_3_p0_03_campaign_recovery.py \
            research_runtime/tests/test_m4_3_p0_04_director_recovery.py \
            research_runtime/tests/test_m4_3_p0_06_approval_boundary.py \
            research_runtime/tests/test_m4_3_evaluation_harness.py \
            research_runtime/tests/test_m4_3_01_1_p0_01_gate.py \
            research_runtime/tests/test_m4_3_01_1_p0_02_blinding.py \
            research_runtime/tests/test_m4_3_01_1_p0_03_persistence.py \
            research_runtime/tests/test_m4_3_01_1_p0_04_protocol.py \
            research_runtime/tests/test_m4_3_01_1_p1_01_metrics.py \
            research_runtime/tests/test_m4_3_01_1_p1_02_boundary.py \
            research_runtime/tests/test_m4_3_01_1_p1_03_real_engine.py \
            research_runtime/tests/test_m4_3_02_p0_gate_success.py \
            research_runtime/tests/test_m4_3_02_state_machine.py \
            research_runtime/tests/test_m4_3_02_review_queue.py \
            research_runtime/tests/test_m4_3_02_analysis_report.py \
            research_runtime/tests/test_m4_3_02_confirmatory.py \
            research_runtime/tests/test_m4_3_02_cli.py \
            research_runtime/tests/test_m4_3_02_pilot_units.py \
            research_runtime/tests/test_m4_3_02_evidence_bundle.py \
            research_runtime/tests/test_m4_3_02_1_paired_eligibility.py \
            research_runtime/tests/test_m4_3_02_1_outcome_semantics.py \
            research_runtime/tests/test_m4_3_02_1_dual_sample_size.py \
            research_runtime/tests/test_m4_3_02_1_multiple_comparisons.py \
            research_runtime/tests/test_m4_3_02_1_group_approval.py \
            research_runtime/tests/test_m4_3_02_1_review_closure.py \
            research_runtime/tests/test_m5_00_loop_state.py \
            research_runtime/tests/test_m5_00_1_budget.py \
            research_runtime/tests/test_m5_00_1_recovery.py \
            research_runtime/tests/test_m5_00_1_crash_injection.py \
            research_runtime/tests/test_m5_01_cross_domain.py \
            research_runtime/tests/test_m5_02_rrsi.py \
            research_runtime/tests/test_m5_integrated_phase0.py \
            research_runtime/tests/test_m5_integrated_runtime.py \
            research_runtime/tests/test_m5_hardening_p0.py \
            research_runtime/tests/test_m6_harness_rsi.py \
            research_runtime/tests/test_m6_1_acceptance.py \
            research_runtime/tests/test_m5_integrated_rrsi.py \
            research_runtime/tests/test_m4_3_02_real_engine.py \
            research_runtime/tests/test_m5_00_real_engine.py \
            research_runtime/tests/test_m5_01_02_real_engine.py \
            research_runtime/tests/test_m5_integrated_real_engine.py \
            research_runtime/tests/test_m6_real_engine.py \
            -q > m3_pytest.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            # Job logs need repo admin to download; re-publish the failure
            # lines as annotations so a red matrix is diagnosable publicly.
            grep -E "^(FAILED |ERROR |E   |[0-9]+ (failed|error))|AssertionError|Error:|ModuleNotFoundError|ImportError" m3_pytest.log \
              | tail -40 \
              | while IFS= read -r line; do echo "::error::$line"; done
            tail -80 m3_pytest.log
          else
            tail -5 m3_pytest.log
          fi
          exit "$rc"

      - name: Verify CLI safety defaults + frozen statistical protocol
        # Independent smoke: the production entry point must default to
        # require-frozen-manifest ON, 5 paired seeds, holdout confirmation ON,
        # and the gate must use the Student-t critical value (not the old 1.96).
        run: |
          python -c "
          from research_runtime.cli import build_parser
          from research_runtime.evolution.statistics import student_t_crit_two_sided
          a = build_parser().parse_args(['loop','--domain','scinet','--baseline-config','b.yaml','--project-dir','p'])
          assert a.require_frozen_manifest is True, 'frozen-manifest must default ON'
          assert a.require_holdout_confirmation is True, 'holdout confirmation must default ON'
          assert a.seeds == [50,51,52,53,54], 'formal ACCEPT requires >=5 seeds by default'
          assert a.min_seeds_for_accept >= 5
          t4 = student_t_crit_two_sided(0.05, 4)
          assert abs(t4 - 2.7764451052) < 1e-6, 'M3.0 Student-t gate must be active'
          assert t4 > 2.77, 'normal 1.96 must NOT be used at n=5'
          b = build_parser().parse_args(['loop','--domain','scinet','--baseline-config','b.yaml','--project-dir','p','--allow-unfrozen-data'])
          assert b.require_frozen_manifest is False, 'explicit dev opt-out must work'
          print('CLI safety defaults + M3.0 protocol OK (t_df4=%.6f)' % t4)
          "
