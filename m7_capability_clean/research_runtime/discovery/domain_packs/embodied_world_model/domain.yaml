name: embodied_world_model
version: m7_domain_pack_v1
description: Simulated robot world-model discovery pack; real frozen data and local numerical engine.
runtime_reuse:
  runtime_state: M5
  harness_rsi: M6
  campaign_dispatcher: M5
  evidence_store: M5
primary_metric: state_mse@1
metric_direction: minimize
statistical_unit: episode_family
seed_is_independent_family: false
splits:
  development: train
  selection: validation
  hidden_holdout: test
  confirmatory_replication: ood
metrics:
  - state_mse@1
  - state_mse@5
  - ood_prediction_error
  - long_horizon_stability
  - planning_performance
  - calibration
  - compute_cost
available_engine_knobs:
  - model.drift_correction
  - model.rollout_horizon
  - train.lr
  - train.epochs
unavailable_mechanisms_must_not_be_claimed:
  - latent_consistency_loss
  - real_robot_hardware_execution
  - external_scinetpp_checkpoint_training
