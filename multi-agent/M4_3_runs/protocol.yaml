# M4.3-01 -- A/B/C Evaluation Protocol configuration (PRE-REGISTRATION SHELL)
#
# This file is the CONFIGURATION SHELL for the harness, NOT a frozen
# confirmatory protocol. M4.3-02 Pilot and M4.3-03 Confirmatory have NOT been
# started in this stage. Fields marked FROZEN_AT_CONFIRMATORY are intentionally
# empty/zero until the confirmatory experiment is pre-registered by an operator.
# The harness refuses to start a confirmatory run until all of them are set.

schema_version: "m4_3_01_protocol_v1"
stage: "M4.3-01"
status: "shell_only_no_runs_started"

# ---------------------------------------------------------------- groups
groups:
  A:
    name: "Manual"
    reads_historical_experience: false
    reads_historical_evidence: false
    reads_historical_failure: false
    autonomous_discovery: false
    description: "Human selects an Objective from current research evidence only."
  B:
    name: "Memory-assisted Manual"
    reads_historical_experience: true
    reads_historical_evidence: true
    reads_historical_failure: true
    autonomous_discovery: false
    description: "Human reads the SAME historical Evidence/Experience/Failure, then selects."
  C:
    name: "Autonomous Discovery"
    reads_historical_experience: true
    reads_historical_evidence: true
    reads_historical_failure: true
    autonomous_discovery: true
    description: "ObjectiveCandidateGenerator + Critic + Ranker select automatically."

# ---------------------------------------------------------------- controls
controls:
  same_snapshot_per_block: true
  same_seed_per_block: true
  same_12_step_gate: true
  external_approval_required: true
  same_campaign_budget: true
  same_paired_seeds: true
  retain_failed_invalid_inconclusive_interrupted: true
  no_posthoc_primary_metric_change: true
  independent_blind_review: true
  ranker_cannot_score_itself: true
  fixed_model_prompt_ranker_domain_policy: true
  fixed_candidate_budget_per_block: true
  fixed_human_selection_time_budget_per_block: true

# ---------------------------------------------------------------- metrics (FROZEN vocabulary)
primary_metrics:
  - independently_reviewed_objective_quality
  - valid_research_findings_per_compute_budget

secondary_metrics:
  - evidence_grounding_rate
  - objective_novelty_rate
  - hypothesis_feasibility_rate
  - plan_validity_rate
  - objective_acceptance_rate
  - duplicate_research_rate
  - invalid_experiment_rate
  - time_to_valid_finding
  - compute_per_valid_finding

safety_metrics:
  - unsupported_evidence_claim_rate
  - false_objective_rate
  - frozen_split_violation_count
  - approval_bypass_count
  - duplicate_campaign_count

# ---------------------------------------------------------------- independent review
independent_review:
  blind_to_arm: true
  blind_to_ranker_score: true
  ranker_never_scores_itself: true
  fixed_rubric_version: "m4_3_objective_quality_rubric_v1"
  rubric_dimensions:
    - evidence_grounding
    - novelty
    - falsifiability
    - intervention_feasibility
    - metric_measurability
    - expected_information_gain
  rubric_scale: [0, 4]
  reason_required: true

# ---------------------------------------------------------------- PRE-REGISTRATION (M4.3-03)
# Intentionally EMPTY until an operator freezes the confirmatory experiment.
# Power analysis from the Pilot determines sample_size.
pre_registration:
  confirmatory: false                 # FROZEN_AT_CONFIRMATORY
  snapshot_set: []                   # FROZEN_AT_CONFIRMATORY
  sample_size: 0                     # FROZEN_AT_CONFIRMATORY (from Pilot power analysis)
  seed: 0                            # FROZEN_AT_CONFIRMATORY
  model_version: ""                  # FROZEN_AT_CONFIRMATORY
  prompt_version: ""                 # FROZEN_AT_CONFIRMATORY
  ranker_version: ""                 # FROZEN_AT_CONFIRMATORY
  domain_policy_version: ""          # FROZEN_AT_CONFIRMATORY
  campaign_budget: {}                # FROZEN_AT_CONFIRMATORY
  paired_seeds: []                   # FROZEN_AT_CONFIRMATORY
  exclusion_rules: []                # FROZEN_AT_CONFIRMATORY
  statistical_method: ""             # FROZEN_AT_CONFIRMATORY
  multiple_comparison_correction: "" # FROZEN_AT_CONFIRMATORY
  stopping_condition: ""             # FROZEN_AT_CONFIRMATORY

# ---------------------------------------------------------------- stage gates
stage_gates:
  M4_3_00_closure: "complete"
  M4_3_01_harness: "complete"
  M4_3_02_pilot: "NOT_STARTED (explicitly paused this stage)"
  M4_3_03_confirmatory: "NOT_STARTED"
  M4_3_04_value_report: "NOT_STARTED"

allowed_conclusions:
  - "ARR Autonomous Discovery has significant incremental value"
  - "ARR improves efficiency but not scientific finding rate"
  - "ARR shows no significant difference vs manual"
  - "current evidence is insufficient to conclude"

forbidden:
  - "forcing a C-group win"
  - "changing the primary metric after seeing results"
  - "dropping unfavourable experiments"
  - "starting Pilot / Confirmatory before pre-registration is frozen"
