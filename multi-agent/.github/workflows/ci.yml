name: ARR Engine-free CI

# Engine-free gate for the Autonomous Research Runtime (ARR 1.1).
#
# WHAT THIS RUNS
#   Only tests that need NO real engine (no torch, no SciNet++ subprocess,
#   no gymnasium/mujoco/lerobot). They verify the coordination logic that
#   M3.4 introduced: cross-domain scheduling, run isolation, idempotent resume,
#   evidence index, the M3.0 statistical gate, the M3.2 embodied real-data
#   contract (stdlib-only, reads the frozen robot_sim_v1 CSV in-repo), and the
#   M3.3 ID/OOD dual-axis gate.
#
# WHAT THIS DOES NOT RUN
#   The real-engine end-to-end run (SciNet++ subprocess + Embodied simulator +
#   Quant backtest) is executed separately on a machine that has those engines
#   and the frozen datasets. It is NEVER replaced by a FakeRunner here. CI
#   passing does NOT claim the real-engine E2E passed; that is reported from
#   the dedicated run (see M3_4_acceptance_report.md).
on:
  push:
    branches: ["feature/arr-0.1-domain-registry"]
  pull_request:
    branches: ["feature/arr-0.1-domain-registry"]
  workflow_dispatch:

jobs:
  engine-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install engine-free test deps
        run: |
          python -m pip install --upgrade pip
          # The engine-free path uses only stdlib + pytest + pydantic.
          pip install "pytest>=8" "pydantic>=2.7.4"

      - name: Run engine-free test suite
        env:
          # Avoid the optional langsmith pytest plugin (needs network/urllib3).
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest research_runtime/tests/test_m3_4_scheduler.py \
                          research_runtime/tests/test_m3_0_statistics.py \
                          research_runtime/tests/test_m3_3_scinet_ood.py \
                          research_runtime/tests/test_m3_2_embodied_real_data.py \
                          -v
