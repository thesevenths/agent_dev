name: ARR 0.1 Integration

# ---------------------------------------------------------------------------
# ARR (Autonomous Research Runtime) 0.1 integration gate.
#
# Coverage categories exercised here:
#   * unit        -> research_runtime unit tests (schemas, critic, proposer, store)
#   * evidence    -> R1 evidence-integrity (MATCH/MISMATCH/UNKNOWN + artifact hash)
#   * adapter     -> R2 domain registry + real ModelAdapter wiring
#   * integration -> research_runtime fake-backed flow / gates / tools / orchestrator
#   * RRSI        -> adaptive_runtime outer-loop bridge (R4) + healthy suite
#   * e2e         -> test_arr_0_1_e2e (INNER autonomous loop + OUTER RRSI loop)
#
# Cross-platform (ubuntu / windows / macos) x Python 3.11 / 3.12 / 3.13.
#
# Safety notes:
#   * No network / LLM / model is required: the autonomous proposer falls back to
#     the deterministic RuleBasedProposer, and RRSI evaluation uses --fake profiles.
#   * RESEARCH_SKIP_E2E=1 guarantees the heavy SciNet++ real-engine E2E tests are
#     skipped (they also self-skip when the checkout / frozen dataset is absent).
#   * The following PRE-EXISTING, ARR-0.1-UNRELATED failures are deselected and
#     tracked separately (they live in adaptive_runtime autopromote / benchmark /
#     evolution / landing, outside the R1-R4 bridge scope):
#       - adaptive_runtime/tests/test_selftest_e2e.py
#       - adaptive_runtime/tests/test_benchmark.py::TestFakeDoesNotPollute::test_real_mode_does_write
#       - adaptive_runtime/tests/test_evolution_version.py::TestRC3StallForcedL3::test_dominant_l1_exhausted_forces_l3
#       - adaptive_runtime/tests/test_landing_roundtrip.py::TestLiveValue::test_falls_back_to_user_area_when_absent
#         (env-dependent: asserts a hardcoded "qwen" fallback that only holds
#          when LLM_MODEL is unset)
# ---------------------------------------------------------------------------

on:
  push:
    branches: [feature/arr-0.1-domain-registry, main]
  pull_request:
    branches: [main, feature/arr-0.1-domain-registry]
  workflow_dispatch:

jobs:
  arr-0-1:
    name: ARR 0.1 (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      RESEARCH_SKIP_E2E: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install minimal test dependencies
        # Only what the ARR 0.1 suites import at module load:
        # pydantic, PyYAML, python-dotenv (langchain_openai is imported lazily
        # by research_runtime.llm_client and never triggered in CI).
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0" "pydantic>=2.7.4" "PyYAML>=6.0" "python-dotenv>=1.0.0"

      - name: Run ARR 0.1 integration suite
        run: |
          python -m pytest tests/rt_tests/ adaptive_runtime/tests/ -q \
            -p no:cacheprovider \
            --deselect adaptive_runtime/tests/test_selftest_e2e.py \
            --deselect "adaptive_runtime/tests/test_benchmark.py::TestFakeDoesNotPollute::test_real_mode_does_write" \
            --deselect "adaptive_runtime/tests/test_evolution_version.py::TestRC3StallForcedL3::test_dominant_l1_exhausted_forces_l3" \
            --deselect "adaptive_runtime/tests/test_landing_roundtrip.py::TestLiveValue::test_falls_back_to_user_area_when_absent"
