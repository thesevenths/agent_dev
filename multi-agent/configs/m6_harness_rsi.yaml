# ARR M6 -- unified Research Harness RSI run configuration.
# The driver manages the entire lifecycle; every transition is journaled into
# the SAME M5 RuntimeState. No second scheduler/store/registry is created.
run_id: m6_harness_rsi_v1
engine: deterministic          # deterministic | real
out_dir: M6_EVIDENCE/run

budget:
  global_budget: 4
  max_rounds: 4

benchmark:
  version: m6_bench_v1
  split_sizes:
    dev: 36
    selection: 12
    holdout: 12
  selection_per_domain: 2     # 6 paired selection tasks
  holdout_per_domain: 2       # 6 paired holdout tasks
  post_adoption_per_domain: 1

preregistration:
  # auto = fixed component->metric rule applied AFTER failure diagnosis and
  # BEFORE any candidate is generated. Never tuned from observed results.
  primary_metric: auto
  direction: maximize
  minimum_meaningful_effect: 0.05
  alpha: 0.05
  n_bootstrap: 500
  n_permutation: 500
  seed: 20261116

candidate:
  component: hypothesis_critic   # one principal research method at a time
  candidate_id: M6_HYPOTHESIS_CRITIC_V2

approval:
  # Explicit human approval is REQUIRED for formal adoption. The driver never
  # writes this file. Provide it yourself (see --emit-approval-template) after
  # reviewing promotion_verdict.json. Absence => INCONCLUSIVE, not adopted.
  source_file: M6_EVIDENCE/human_approval.json

real_engine:
  enabled: false
  timeout_s: 900
  max_tasks_per_domain: 2
