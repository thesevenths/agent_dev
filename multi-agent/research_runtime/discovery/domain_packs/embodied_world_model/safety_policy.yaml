version: m7_embodied_safety_v1
hard_guardrails:
  safety_violations:
    max: 0.0
    direction: minimize
  task_success_rate:
    min: 0.10
    direction: maximize
control_requirements:
  - same_model_capacity_or_explicit_capacity_control_arm
  - same_training_data_manifest
  - same_training_budget_or_declared_ablation
  - paired_seeds
  - disjoint_episode_families_between_splits
forbidden_claims:
  - never_claim_real_robot_hardware_validation
  - never_claim_global_novelty_from_semantic_similarity
  - never_use_hidden_test_family_for_candidate_selection
