data:
  adapt_samples: 16
  block_size: 100
  frozen_dir: datasets/arr_emb_rsi_02/newton_ood_v1
  generator: newton
  newton:
    force_range:
    - 0.5
    - 5.0
    mass_range:
    - 0.5
    - 3.0
    v0_range:
    - -0.5
    - 0.5
    x0_range:
    - -0.5
    - 0.5
  sequence_length: 500
  t_max: 6.0
  test_samples: 16
  train_samples: 64
  validation_samples: 16
device: cpu
experiment: newton
jepa:
  ema_momentum: 0.996
  ema_warmup_epochs: 10
  pred_weight: 1.0
  rollout_steps:
  - 1
  - 2
  - 3
  - 4
  vicreg_cov_weight: 1.0
  vicreg_var_weight: 25.0
model:
  conv_channels:
  - 64
  - 128
  - 128
  encoder_hidden:
  - 256
  - 128
  encoder_type: conv
  latent_dim: 4
  pred_tf_heads: 2
  pred_tf_layers: 2
  predictor_hidden:
  - 256
  - 256
  predictor_type: mlp
  tf_d_model: 64
  tf_heads: 4
  tf_layers: 2
output_dir: outputs
probe:
  epochs: 50
  hidden:
  - 32
  - 16
  lr: 0.001
  out_dim: 2
seed: 42
symbolic:
  batch_size: 100
  binary_operators:
  - +
  - '-'
  - '*'
  - /
  early_stop: 0.0
  max_complexity: 15
  niterations: 40
  parallelism: serial
  unary_operators:
  - exp
  - cos
  - log
  - sqrt
  - inv
train:
  batch_size: 16
  epochs: 1
  lr: 0.0005
  weight_decay: 0.0001
tta:
  adapt_encoder: false
  lr: 0.0005
  n_samples: 64
  steps: 30
